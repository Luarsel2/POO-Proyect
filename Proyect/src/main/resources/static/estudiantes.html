<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estudiantes - Portal Universitario UVG</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div>
      <h1>Portal de Gestión Universitaria</h1>
      <span class="subtitulo">Prototipo POO · Universidad del Valle de Guatemala</span>
    </div>
  </header>

  <nav class="menu">
    <a href="index.html">Inicio</a>
    <a href="estudiantes.html" class="activo">Estudiantes</a>
    <a href="personal.html">Personal</a>
    <a href="cursos-secciones.html">Cursos y Secciones</a>
    <a href="facultades-carreras.html">Facultades y Carreras</a>
    <a href="periodos-inscripciones.html">Períodos e Inscripciones</a>
  </nav>

  <main>
    <h2 class="titulo-seccion">Estudiantes</h2>

    <div class="tarjeta">
      <h3>Registrar nuevo estudiante</h3>
      <form id="form-estudiante">
        <div class="form-grid">
          <div><label>ID</label><input type="number" name="id" min="0" required></div>
          <div><label>Nombre</label><input type="text" name="nombre" pattern="[A-Za-zÁ-Úá-úñÑ\s]+" title="Solo se permiten letras y espacios" required></div>
          <div><label>Apellido</label><input type="text" name="apellido" pattern="[A-Za-zÁ-Úá-úñÑ\s]+" title="Solo se permiten letras y espacios" required></div>
          <div><label>Fecha nacimiento</label><input type="date" name="fechaNacimiento" max="2026-10-05"></div>
          <div><label>Correo</label><input type="email" name="correo" required></div>
          <div><label>Teléfono</label><input type="number" name="telefono" min="0"></div>
          <div><label>Dirección</label><input type="text" name="direccion"></div>
          <div><label>Carnet</label><input type="number" name="carnet" min="0" required></div>
          <div><label>Año de ingreso</label><input type="number" name="fechaIngreso" min="1966" max="2026" placeholder="2026"></div>
          <div>
            <label>Estado</label>
            <select name="estado">
              <option>Activo</option>
              <option>Inactivo</option>
              <option>Graduado</option>
            </select>
          </div>
          <div><label>Promedio general</label><input type="number" step="0.1" name="promedioGeneral" min="0" max="100"></div>
          <div><label>ID historial académico</label><input type="number" name="idHistorial" min="0" required></div>
        </div>
        <button type="submit">Registrar estudiante</button>
        <div class="mensaje" id="msg-estudiante"></div>
      </form>
    </div>

    <div class="tarjeta">
      <h3>Inscribir curso a un estudiante</h3>
      <form id="form-inscribir-curso">
        <div class="form-grid">
          <div><label>Carnet del estudiante</label><input type="number" name="carnet" required></div>
        </div>
        <button type="submit" class="secundario">Inscribir curso</button>
        <div class="mensaje" id="msg-inscribir-curso"></div>
      </form>
    </div>

    <div class="tarjeta">
      <h3>Estudiantes registrados</h3>
      <button type="button" class="secundario" onclick="cargarEstudiantes()">Actualizar lista</button>
      <div id="tabla-estudiantes"></div>
    </div>
  </main>

  <script src="js/app.js"></script>
  <script>
    alEnviar("form-estudiante", async (fd) => {
      const body = {
        id: Number(fd.get("id")),
        nombre: fd.get("nombre"),
        apellido: fd.get("apellido"),
        fechaNacimiento: fd.get("fechaNacimiento"),
        correo: fd.get("correo"),
        telefono: Number(fd.get("telefono")) || 0,
        direccion: fd.get("direccion"),
        carnet: Number(fd.get("carnet")),
        fechaIngreso: Number(fd.get("fechaIngreso")) || 0,
        estado: fd.get("estado"),
        promedioGeneral: Number(fd.get("promedioGeneral")) || 0,
        idHistorial: Number(fd.get("idHistorial"))
      };
      const { ok, data } = await postJSON("/estudiantes", body);
      mostrarMensaje("msg-estudiante", data.mensaje, !ok);
      document.getElementById("form-estudiante").reset();
      cargarEstudiantes();
    });

    alEnviar("form-inscribir-curso", async (fd) => {
      const carnet = Number(fd.get("carnet"));
      const { ok, data } = await postJSON(`/estudiantes/${carnet}/inscribir-curso`, {});
      mostrarMensaje("msg-inscribir-curso", data.mensaje, !ok || data.mensaje.startsWith("Error"));
    });

    async function cargarEstudiantes() {
      const estudiantes = await getJSON("/estudiantes");
      const filas = (estudiantes || []).map(e => [
        v(e.carnet), v(e.nombre), v(e.apellido), v(e.correo), v(e.estado), v(e.promedioGeneral)
      ]);
      document.getElementById("tabla-estudiantes").innerHTML =
        construirTabla(["Carnet", "Nombre", "Apellido", "Correo", "Estado", "Promedio"], filas);
    }

    cargarEstudiantes();
  </script>
</body>
</html>
